[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "common-unity-landscan"
version = "1.0.0"
description = "Common Unity LandScan — LiDAR tiles to a bare-earth terrain model and archaeological views, no GIS install needed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "laspy>=2.5", "lazrs>=0.6", "rasterio>=1.3", "pyproj>=3.6", "Pillow>=10"]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]

[project.scripts]
landscan = "landscan.cli:main"

[tool.setuptools.packages.find]
include = ["landscan*"]
